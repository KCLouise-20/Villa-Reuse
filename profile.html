<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Profile · Villa-Reuse</title>
  <link rel="preconnect" href="[fonts.googleapis.com](https://fonts.googleapis.com)" />
  <link rel="preconnect" href="[fonts.gstatic.com](https://fonts.gstatic.com)" crossorigin />
  <link href="[fonts.googleapis.com](https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600&display=swap)" rel="stylesheet" />
  <link rel="stylesheet" href="css/main.css" />
</head>
<body>
  <header class="header">
    <a class="header__brand" href="index.html">
      <span class="header__logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l7-7"/></svg>
      </span>
      <span>
        <span class="header__title">Villa-Reuse</span>
        <span class="header__tagline">GIVE WELL. LIVE LIGHTER.</span>
      </span>
    </a>
    <div class="header__actions">
      <div class="coins" aria-label="ReUse Coins balance">
        <span class="coins__icon">$</span>
        <span class="coins__label">ReUse Coins</span>
        <span class="coins__value" id="header-balance">120</span>
      </div>
      <button class="icon-btn" aria-label="Notifications">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="icon-btn__badge">3</span>
      </button>
      <div class="avatar" aria-label="Your profile">YO</div>
    </div>
  </header>

  <div class="app">
    <aside class="sidebar">
      <nav class="sidebar__nav">
        <a class="sidebar__link" href="index.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
          Home
        </a>
        <a class="sidebar__link" href="donate.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          Donate
        </a>
        <a class="sidebar__link" href="impact.html">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
          Impact
        </a>
        <a class="sidebar__link sidebar__link--active" href="profile.html" aria-current="page">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-7 8-7s8 3 8 7"/></svg>
          Profile
        </a>
      </nav>
      <div class="sidebar-card">
        <svg class="sidebar-card__icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#1f7a3f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19c0-8 5-13 14-14 0 9-5 14-14 14z"/><path d="M5 19l7-7"/></svg>
        <h3 class="sidebar-card__title">Small acts, shared impact.</h3>
        <p class="sidebar-card__text">Every item passed on keeps value in our community.</p>
      </div>
    </aside>

    <main class="content profile-shell">
      <p class="eyebrow">YOUR VILLA-REUSE</p>
      <h1 class="profile-title">Profile</h1>

      <div class="profile-columns">
        <section class="card profile-card">
          <div class="profile-card__avatar" id="profile-avatar">YO</div>
          <h2 class="profile-card__name" id="profile-name">—</h2>
          <p class="profile-card__email" id="profile-email">—</p>
          <p class="profile-card__meta" id="profile-meta">—</p>

          <div class="balance-panel">
            <span class="balance-panel__icon">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v10M9.5 9.5h4a1.5 1.5 0 0 1 0 3h-3a1.5 1.5 0 0 0 0 3h4" stroke-linecap="round"/></svg>
            </span>
            <div>
              <p class="balance-panel__label">CURRENT BALANCE</p>
              <p class="balance-panel__value"><span id="profile-balance">0</span> ReUse Coins</p>
            </div>
          </div>

          <dl class="profile-figures">
            <div class="profile-figures__item">
              <dt class="profile-figures__value" id="figure-items">0</dt>
              <dd class="profile-figures__label">items shared</dd>
            </div>
            <div class="profile-figures__item">
              <dt class="profile-figures__value" id="figure-waste">0 kg</dt>
              <dd class="profile-figures__label">waste saved</dd>
            </div>
          </dl>

          <button class="btn btn--outline" type="button" id="edit-profile">Edit profile</button>
        </section>

        <section class="card activity-card">
          <h2 class="card__title">Your activity</h2>
          <ul class="activity-list" id="activity-list"></ul>
          <button class="activity-logout" type="button" id="logout-btn">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 20H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h5"/><path d="M16 17l5-5-5-5"/><path d="M21 12H10"/></svg>
            Log out
          </button>
        </section>
      </div>
    </main>
  </div>

  <button class="privacy-banner" type="button">Do not sell or share my personal info</button>
  <script type="module" src="dist/profile.js"></script>
</body>
</html>
